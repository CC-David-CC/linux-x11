Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "false"
    Option "AllowMouseOpenFail" "true"
EndSection
Section "Device"
    Identifier "v86 VGA"
    Driver "modesetting"
    Option "AccelMethod" "none"
    Option "kmsdev" "/dev/dri/card0"
EndSection
Section "Screen"
    Identifier "Screen"
    Device "v86 VGA"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "800x600"
    EndSubSection
EndSection
Section "Files"
    FontPath "/usr/share/fonts/X11/misc"
EndSection
Section "ServerLayout"
    Identifier "Browser desktop"
    Screen "Screen"
    InputDevice "CoreKeyboard" "CoreKeyboard"
    InputDevice "CorePointer" "CorePointer"
EndSection
